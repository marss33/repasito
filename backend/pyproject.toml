[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
timeout = 60  # ningún test puede quedar colgado (por ejemplo, esperando un WebSocket)

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
